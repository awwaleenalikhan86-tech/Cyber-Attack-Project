<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Attack Detection System</title>
    <link rel="stylesheet" href="04-styles.css">
  
</head>

<body>

    
    <!-- LOGIN PAGE (PHONE STYLE) -->

    <div id="loginPage" class="phone-container">
        <div class="phone">
            <h1>Cyber Attack Detection System</h1>

            <div class="login-box">
                <h2>Login</h2>
                <input type="text" id="username" placeholder="Enter ID">
                <input type="password" id="password" placeholder="Enter Password">
                <button onclick="login()">Login</button>
                <p id="error"></p>
            </div>
        </div>
    </div>

    

    <script src="script.js"></script>
</body>


</html>
